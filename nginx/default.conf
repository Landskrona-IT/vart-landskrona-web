server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    etag off;

    # The page is opened inside a mobile WebView at a stable URL. Do not let
    # WebKit retain an old HTML shell, stylesheet, or JavaScript bundle.
    location ~* \.(html|css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
